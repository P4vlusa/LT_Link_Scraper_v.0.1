name: Crawl Vietnam laptops

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Sites, separated by spaces; leave blank for all"
        required: false
        default: ""
      delay:
        description: "Delay between requests in seconds"
        required: false
        default: "1.0"
  schedule:
    - cron: "15 20 * * 0"

permissions:
  contents: read

concurrency:
  group: vietnam-laptop-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run crawler
        env:
          INPUT_SITES: ${{ github.event.inputs.sites || '' }}
          INPUT_DELAY: ${{ github.event.inputs.delay || '1.0' }}
        run: |
          mkdir -p output
          if [ -n "$INPUT_SITES" ]; then
            read -r -a SITE_ARGS <<< "$INPUT_SITES"
            python vietnam_laptop_crawler.py \
              --sites "${SITE_ARGS[@]}" \
              --delay "$INPUT_DELAY" \
              --output output/vietnam_laptops.csv \
              --json
          else
            python vietnam_laptop_crawler.py \
              --delay "$INPUT_DELAY" \
              --output output/vietnam_laptops.csv \
              --json
          fi

      - name: Show output summary
        if: always()
        run: |
          ls -lah output || true
          if [ -f output/vietnam_laptops.csv ]; then
            echo "CSV rows including header: $(wc -l < output/vietnam_laptops.csv)"
          fi

      - name: Upload crawler results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vietnam-laptops-${{ github.run_number }}
          path: |
            output/vietnam_laptops.csv
            output/vietnam_laptops.json
          if-no-files-found: warn
          retention-days: 30
