name: Crawl Vietnam laptops

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Site names separated by spaces; blank = all 12"
        required: false
        default: ""
      delay:
        description: "Delay between requests in seconds"
        required: false
        default: "1.0"
  schedule:
    - cron: "15 20 * * 0"

permissions:
  contents: write

concurrency:
  group: vietnam-laptop-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run crawler
        env:
          INPUT_SITES: ${{ github.event.inputs.sites || '' }}
          INPUT_DELAY: ${{ github.event.inputs.delay || '1.0' }}
        run: |
          mkdir -p output

          if [ -n "$INPUT_SITES" ]; then
            read -r -a SITE_ARGS <<< "$INPUT_SITES"
            python vietnam_laptop_crawler.py \
              --sites "${SITE_ARGS[@]}" \
              --delay "$INPUT_DELAY" \
              --output output/vietnam_laptops.csv \
              --json
          else
            python vietnam_laptop_crawler.py \
              --delay "$INPUT_DELAY" \
              --output output/vietnam_laptops.csv \
              --json
          fi

      - name: Verify generated files
        run: |
          echo "Generated files:"
          find output -maxdepth 2 -type f -print | sort
          test -f output/vietnam_laptops.csv
          test -f output/vietnam_laptops.json
          echo "CSV rows including header:"
          wc -l output/vietnam_laptops.csv

      - name: Commit generated files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f output/vietnam_laptops.csv
          git add -f output/vietnam_laptops.json

          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Update laptop crawler results"
            git push
          fi

      - name: Upload crawler results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vietnam-laptops-${{ github.run_number }}
          path: |
            output/vietnam_laptops.csv
            output/vietnam_laptops.json
          if-no-files-found: error
          retention-days: 30
